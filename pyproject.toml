[project]
name = "cn.lovexiaov.agent.log"
version = "1.4.0"
description = "Language-neutral AgentLog logging framework for Python (Schema v1, standard-library only)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AgentLog Contributors" }]
keywords = ["logging", "observability", "agent", "telemetry", "schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lovexiaov/agent-log-python"
Repository = "https://github.com/lovexiaov/agent-log-python"
Documentation = "https://github.com/lovexiaov/agent-log-python#readme"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentlog*"]

[tool.pytest.ini_options]
# NOTE: this project is stdlib-only and uses unittest, not pytest.
